_base_: ../_base_/default.yaml

model:
  optimizer: gpt-4o
  target: gpt-4o
  reasoning_effort: ""

train:
  batch_size: 8
  num_epochs: 4
  accumulation: 1

gradient:
  minibatch_size: 4
  merge_batch_size: 4

optimizer:
  learning_rate: 4
  use_slow_update: false
  use_meta_skill: false
  slow_update_samples: 8

env:
  name: testdatagen
  skill_init: skillopt/envs/testdatagen/skills/initial.md
  split_mode: split_dir
  split_dir: data/testdatagen
  workers: 4
  limit: 0